const nn=t=>t.normalize('NFC').replace(/\s+/g,'');
const norm=t=>{let n=t.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z]/g,'');return n==='porto'?'oporto':n};
async function dec(pw){const r=Uint8Array.from(atob(DATA),c=>c.charCodeAt(0));const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:r.slice(0,16),iterations:600000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:r.slice(16,28)},key,r.slice(28)))}
async function go(){const m=document.getElementById('m');if(!window.crypto||!crypto.subtle){m.textContent='Abre este enlace con https:// para que funcione.';return}
m.textContent='Comprobando…';g.disabled=true;
try{const h=await dec(norm(i.value)+'|'+nn(j.value));document.open();document.write(h);document.close()}
catch(e){m.textContent='Mmm, alguna no es 😏 Piensa un poco más…';b.classList.remove('sh');void b.offsetWidth;b.classList.add('sh');g.disabled=false}}
g.onclick=go;[i,j].forEach(x=>x.addEventListener('keydown',e=>{if(e.key==='Enter')go()}));
</script></body></html>
